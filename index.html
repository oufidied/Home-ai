<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home AI">
<meta name="theme-color" content="#0b0b0f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Home AI</title>
<style>
:root{
  --bg:#0b0b0f; --panel:#14151b; --panel2:#1c1d26; --line:#272935;
  --text:#ececf1; --muted:#8b8d9a; --accent:#7c6cff; --accent2:#4f8cff;
  --green:#34d399; --amber:#fbbf24; --red:#f87171;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;left:0;right:0;top:0;height:var(--app-h,100dvh);display:flex;flex-direction:column}

header{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;
  border-bottom:1px solid var(--line);background:rgba(11,11,15,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.icon-btn{width:42px;height:42px;border:0;background:transparent;color:var(--text);border-radius:12px;display:grid;place-items:center;flex:none}
.icon-btn:active{background:var(--panel2)}
.icon-btn svg{width:22px;height:22px}
.title{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
#titleBtn{background:none;border:0;color:var(--text);font-size:16px;font-weight:600;display:flex;align-items:center;gap:4px;max-width:100%;padding:2px 8px;border-radius:10px}
#titleBtn:active{background:var(--panel2)}
#titleText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#titleBtn svg{width:14px;height:14px;flex:none;color:var(--muted)}
.pill{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;background:none;border:0;padding:1px 6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:.3s}
.pill.online .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.pill.checking .dot{background:var(--amber);animation:pulse 1s infinite}
.pill.error .dot{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 8px}
.msg{max-width:760px;margin:0 auto 18px}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.msg.user .bubble{background:var(--panel2);border:1px solid var(--line);padding:9px 14px;border-radius:20px 20px 6px 20px;
  max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user .imgs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:6px;max-width:85%}
.msg.user .imgs img{width:120px;height:120px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.msg.user .imgs img:only-child{width:200px;height:auto;max-height:260px}
.msg.assistant .bubble{overflow-wrap:anywhere}
.bubble p{margin:0}
.bubble .gap{height:.65em}
.bubble h4{margin:.5em 0 .2em;font-size:1.05em}
.bubble ul,.bubble ol{margin:.15em 0;padding-left:1.35em}
.bubble li{margin:.1em 0}
.bubble code{font:13.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel2);padding:1px 5px;border-radius:5px}
.bubble pre{position:relative;background:#101118;border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;margin:.5em 0}
.bubble pre code{background:none;padding:0;white-space:pre;display:block}
.bubble pre .cp{position:absolute;top:6px;right:6px;font-size:11px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:3px 8px}
.bubble a{color:var(--accent2)}
details.think{margin:0 0 10px;border-left:2px solid var(--line);padding-left:10px;color:var(--muted);font-size:14px}
details.think summary{list-style:none;font-size:13px;user-select:none}
details.think summary::-webkit-details-marker{display:none}
details.think summary::before{content:"▸ ";}
details.think[open] summary::before{content:"▾ ";}
details.think .tb{white-space:pre-wrap;margin-top:6px;max-height:40vh;overflow:auto}
.meta{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--muted)}
.meta button{background:none;border:0;color:var(--muted);font-size:12px;padding:0}
.meta .model-tag{margin-left:auto;opacity:.7}
.err{color:var(--red);font-size:14px;margin-top:4px;line-height:1.4}
.typing::after{content:"▍";animation:blink 1s steps(2) infinite;color:var(--accent)}
.loading-note{color:var(--muted);font-size:14px}
@keyframes blink{50%{opacity:0}}

.empty{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);gap:10px;padding:20px}
.empty img{width:72px;height:72px;border-radius:20px}
.empty h2{margin:4px 0 0;color:var(--text);font-size:22px;font-weight:600}
.empty p{margin:0;max-width:280px;font-size:14px}
.empty .setup{margin-top:8px}

footer{padding:6px 10px calc(env(safe-area-inset-bottom) + 8px)}
.attachments{max-width:760px;margin:0 auto 6px;display:flex;gap:8px;overflow-x:auto}
.attachments:empty{display:none}
.thumb{position:relative;flex:none}
.thumb img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.thumb button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--text);color:var(--bg);font-size:14px;line-height:22px;padding:0}
.composer{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:5px}
.c-btn{width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}
.c-btn svg{width:21px;height:21px}
.c-btn:active{background:var(--panel2)}
.c-btn.rec{color:#fff;background:var(--red);animation:recpulse 1.2s infinite}
@keyframes recpulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.6)}50%{box-shadow:0 0 0 7px rgba(248,113,113,0)}}
#input{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);font-family:inherit;font-size:16px;line-height:1.4;max-height:160px;padding:8px 2px;margin:0;min-width:0}
#input::placeholder{color:var(--muted)}
#send{width:38px;height:38px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;flex:none}
#send svg{width:18px;height:18px}
#send:disabled{opacity:.3}
#send.stop{background:var(--text);color:var(--bg)}

.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 14px;font-size:15px}
.btn.primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600}
.btn.danger{color:var(--red)}
.btn.small{padding:6px 10px;font-size:13px}

/* drawer */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);background:var(--panel);border-right:1px solid var(--line);
  transform:translateX(-102%);transition:transform .25s ease;display:flex;flex-direction:column;z-index:11;
  padding:calc(env(safe-area-inset-top) + 12px) 10px calc(env(safe-area-inset-bottom) + 10px)}
body.drawer-open #drawer{transform:none}
body.drawer-open #scrim{opacity:1;pointer-events:auto}
#drawer .top{display:flex;gap:8px;margin-bottom:10px}
#drawer .top .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}
#chatList{flex:1;overflow-y:auto;margin:0 -4px}
.chat-item{display:flex;align-items:center;border-radius:10px;padding:0 4px 0 10px}
.chat-item.active{background:var(--panel2)}
.chat-item button.open{flex:1;text-align:left;background:none;border:0;color:var(--text);padding:11px 0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item button.del{background:none;border:0;color:var(--muted);width:34px;height:34px;font-size:18px}
.list-empty{color:var(--muted);font-size:14px;padding:10px}
.list-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:6px 6px}

/* sheets */
.sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.55);align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet-card{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  padding:18px 18px calc(env(safe-area-inset-bottom) + 18px)}
.sheet-card h3{margin:0 0 14px;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-card h3 span{flex:1}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 12px;font-family:inherit;font-size:16px;outline:0}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.row{display:flex;gap:8px;flex-wrap:wrap}
#testOut{font-size:13px;margin:4px 0 14px;min-height:1em}
#testOut.ok{color:var(--green)} #testOut.bad{color:var(--red)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;font-size:15px}
.switch input{width:22px;height:22px;accent-color:var(--accent)}

.model-list{display:flex;flex-direction:column;gap:6px}
.model{display:flex;align-items:center;gap:8px;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:0 10px 0 0;color:var(--text)}
.model.sel{border-color:var(--accent);background:rgba(124,108,255,.1)}
.model .pick{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;background:none;border:0;color:var(--text);padding:12px 0 12px 10px}
.model .act{flex:none;border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:10px;padding:7px 12px;font-size:13px}
.model .act.load{color:#fff;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.model .act:disabled{opacity:.5}
.model .mn{flex:1;min-width:0}
.model .mn .badges{margin-top:5px}
.model .mn b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model .mn small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.badges{display:flex;gap:4px;flex:none}
.badge{font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.badge.on{color:var(--green);border-color:rgba(52,211,153,.4)}
.badge.vis{color:var(--accent2);border-color:rgba(79,140,255,.4)}
.model .tick{width:20px;color:var(--accent);flex:none;text-align:center}
.model-note{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.45}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translate(-50%,-20px);background:var(--panel2);border:1px solid var(--line);
  color:var(--text);padding:10px 14px;border-radius:14px;font-size:14px;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:.25s;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon-btn" id="menuBtn" aria-label="Chats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <div class="title">
      <button id="titleBtn" aria-label="Switch model"><span id="titleText">Home AI</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button class="pill" id="pill"><span class="dot"></span><span id="pillText">Checking…</span></button>
    </div>
    <button class="icon-btn" id="newBtn" aria-label="New chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
  </header>

  <main id="messages"></main>

  <footer>
    <div class="attachments" id="attachments"></div>
    <div class="composer">
      <button class="c-btn" id="attachBtn" aria-label="Add image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg>
      </button>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <textarea id="input" rows="1" placeholder="Message your PC…"></textarea>
      <button class="c-btn" id="micBtn" aria-label="Voice input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4"/></svg>
      </button>
      <button id="send" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </footer>
</div>

<div id="scrim"></div>
<aside id="drawer">
  <div class="top">
    <button class="btn primary" id="drawerNew">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New chat
    </button>
    <button class="btn" id="settingsBtn" aria-label="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    </button>
  </div>
  <div class="list-label">Chats</div>
  <div id="chatList"></div>
</aside>

<div class="sheet" id="modelSheet">
  <div class="sheet-card">
    <h3><span>Models</span><button class="btn small" id="refreshModels">Refresh</button>
      <button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3>
    <div class="model-list" id="modelList"></div>
    <div class="model-note">Tap a model to use it. <b>Load</b> loads it on your PC now (and unloads the others to free memory); otherwise it loads when you send your first message. <b>Vision</b> models can see images.</div>
  </div>
</div>

<div class="sheet" id="settingsSheet">
  <div class="sheet-card">
    <h3><span>Settings</span><button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3>
    <div class="field">
      <label for="sUrl">Address (your Pi, or the PC directly)</label>
      <input id="sUrl" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="sToken">LM Studio API token</label>
      <input id="sToken" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Paste your token">
      <div class="hint">Saved only on this phone.</div>
    </div>
    <div class="row"><button class="btn" id="testBtn">Test connection</button></div>
    <div id="testOut"></div>
    <div class="field">
      <label for="sSystem">System prompt</label>
      <textarea id="sSystem" rows="3"></textarea>
    </div>
    <label class="switch">Read answers aloud automatically <input type="checkbox" id="sAutoSpeak"></label>
    <div class="row" style="justify-content:space-between">
      <button class="btn danger" id="wipeBtn">Delete all chats</button>
      <button class="btn primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(async () => {
  const $ = s => document.querySelector(s);
  const DEFAULT_URL = "https://arthur-pc.taild9cfe3.ts.net";
  const DEFAULT_SYSTEM = "You are Arthur's personal AI assistant running on his own PC. Be clear, direct and concise.";

  // ---------- storage (settings in localStorage, chats in IndexedDB so images fit) ----------
  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const idb = {
    p: null,
    open() {
      if (!this.p) this.p = new Promise((res, rej) => {
        const r = indexedDB.open("home-ai", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
      return this.p;
    },
    async get(k) { const d = await this.open(); return new Promise((res, rej) => { const r = d.transaction("kv").objectStore("kv").get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
    async set(k, v) { const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
  };

  let settings = Object.assign({ url: DEFAULT_URL, token: "", model: "", system: DEFAULT_SYSTEM, autoSpeak: false }, ls.get("settings", {}));
  if (!settings.url) settings.url = DEFAULT_URL;
  let chats = null;
  try { chats = await idb.get("chats"); } catch {}
  if (!Array.isArray(chats)) chats = ls.get("chats", []);
  let currentId = ls.get("currentId", null);
  let models = [];          // [{id, type, loaded, vision}]
  let modelsDetailed = false;
  let canManage = false;    // LM Studio supports load/unload over the API
  let busyModel = null;     // model currently being loaded/unloaded from the app
  let gw = null;            // Pi gateway status (null = talking to the PC directly)
  let piModels = [];        // models running on the Pi (Ollama)
  let controller = null;
  let status = "checking";
  let pending = [];         // images attached to the next message (data URLs)

  const els = {
    messages: $("#messages"), input: $("#input"), send: $("#send"), pill: $("#pill"), pillText: $("#pillText"),
    chatList: $("#chatList"), title: $("#titleText"), attachments: $("#attachments"), mic: $("#micBtn")
  };

  // ---------- helpers ----------
  const base = () => settings.url.trim().replace(/\/+$/, "").replace(/\/v1$/, "");
  const headers = () => {
    const h = { "Content-Type": "application/json" };
    if (settings.token.trim()) h.Authorization = "Bearer " + settings.token.trim();
    return h;
  };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const current = () => chats.find(c => c.id === currentId) || null;
  function save() {
    ls.set("currentId", currentId);
    idb.set("chats", chats).catch(() => ls.set("chats", chats));
  }
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  let toastT;
  function toast(msg, ms = 2600) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms);
  }

  function parts(m) {
    let r = m.reasoning || "", c = m.content || "";
    const s = c.indexOf("<think>");
    if (s >= 0) {
      const e = c.indexOf("</think>", s);
      if (e >= 0) { r += c.slice(s + 7, e); c = c.slice(0, s) + c.slice(e + 8); }
      else { r += c.slice(s + 7); c = c.slice(0, s); }
    } else {
      const e = c.indexOf("</think>");
      if (e >= 0) { r += c.slice(0, e); c = c.slice(e + 8); }
    }
    return { r: r.trim(), c: c.replace(/^\s+/, "") };
  }

  function md(src) {
    const blocks = [];
    src = src.replace(/```[^\n`]*\n?([\s\S]*?)(```|$)/g, (_, code) => {
      blocks.push('<pre><button class="cp">Copy</button><code>' + esc(code.replace(/\n$/, "")) + "</code></pre>");
      return "\n\u0000" + (blocks.length - 1) + "\u0000\n";
    });
    let html = esc(src)
      .replace(/`([^`\n]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    const out = []; let list = null;
    const close = () => { if (list) { out.push("</" + list + ">"); list = null; } };
    for (const ln of html.split("\n")) {
      let m;
      if (/^\u0000\d+\u0000$/.test(ln.trim())) { close(); out.push(ln.trim()); }
      else if ((m = ln.match(/^\s*#{1,6}\s+(.*)/))) { close(); out.push("<h4>" + m[1] + "</h4>"); }
      else if ((m = ln.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push("<li>" + m[1] + "</li>"); }
      else if ((m = ln.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push("<li>" + m[1] + "</li>"); }
      else if (ln.trim() === "") { close(); if (out.length && out[out.length - 1] !== '<div class="gap"></div>') out.push('<div class="gap"></div>'); }
      else { close(); out.push("<p>" + ln + "</p>"); }
    }
    close();
    return out.join("").replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
  }

  // ---------- models & status ----------
  function setStatus(s, text) {
    status = s;
    els.pill.className = "pill " + (s === "online" ? "online" : s === "checking" ? "checking" : (s === "setup" || s === "asleep") ? "" : "error");
    els.pillText.textContent = text;
  }

  async function timedFetch(url, ms, opts = {}) {
    const ac = new AbortController(); const t = setTimeout(() => ac.abort(), ms);
    try { return await fetch(url, Object.assign({ headers: headers(), signal: ac.signal, cache: "no-store" }, opts)); }
    finally { clearTimeout(t); }
  }

  // Returns {state, text}; fills `models`.
  async function probePc(timeoutMs = 6000) {
    try {
      // LM Studio's REST API v1: full info (loaded instances, vision, size)
      let res = await timedFetch(base() + "/api/v1/models", timeoutMs);
      if (res.status === 401 || res.status === 403) return { state: "error", text: "Token rejected" };
      if (res.status === 502 || res.status === 503) return { state: "error", text: "LM Studio server off" };
      if (res.ok) {
        const j = await res.json();
        if (Array.isArray(j.models)) {
          models = j.models.filter(m => m.type === "llm").map(m => ({
            id: m.key, name: m.display_name || m.key, type: m.type,
            instances: (m.loaded_instances || []).map(i => i.id),
            loaded: (m.loaded_instances || []).length > 0,
            vision: !!(m.capabilities && m.capabilities.vision),
            size: m.size_bytes, params: m.params_string
          }));
          modelsDetailed = true; canManage = true;
          return { state: "online", text: "PC online" };
        }
      }
      canManage = false;
      // older LM Studio API (v0)
      res = await timedFetch(base() + "/api/v0/models", timeoutMs);
      if (res.ok) {
        const j = await res.json();
        const list = (j.data || []).filter(m => m.type !== "embeddings" && !/embed/i.test(m.id));
        models = list.map(m => ({ id: m.id, type: m.type, loaded: m.state === "loaded", instances: m.state === "loaded" ? [m.id] : [], vision: m.type === "vlm" }));
        modelsDetailed = true;
        return { state: "online", text: "PC online" };
      }
      if (res.status === 401 || res.status === 403) return { state: "error", text: "Token rejected" };
      if (res.status === 502 || res.status === 503) return { state: "error", text: "LM Studio server off" };
      // fall back to OpenAI-style list
      res = await timedFetch(base() + "/v1/models", timeoutMs);
      if (res.status === 401 || res.status === 403) return { state: "error", text: "Token rejected" };
      if (!res.ok) return { state: "error", text: "Error " + res.status };
      const j = await res.json();
      models = (j.data || []).map(m => m.id).filter(id => !/embed/i.test(id)).map(id => ({ id, type: "llm", loaded: true, vision: null }));
      modelsDetailed = false;
      return { state: "online", text: "PC online" };
    } catch {
      return { state: "offline", text: "PC offline" };
    }
  }

  // Talks to the Pi gateway if there is one, otherwise straight to the PC.
  async function gwFetchStatus(timeoutMs) {
    const r = await timedFetch(base() + "/gw/status" + (document.hidden ? "" : "?active=1"), timeoutMs);
    if (r.status === 401 || r.status === 403) return { auth: false };
    if (!r.ok) return null;
    const j = await r.json().catch(() => null);
    return j && j.gateway ? j : null;
  }

  async function probe(timeoutMs = 6000) {
    if (!base()) return { state: "setup", text: "Enter your PC address first" };
    let g = null;
    try { g = await gwFetchStatus(timeoutMs); }
    catch { gw = null; return { state: "offline", text: "Can't reach it" }; }
    if (g && g.auth === false) return { state: "error", text: "Token rejected" };
    gw = g;
    if (!gw) {
      const r = await probePc(timeoutMs);
      if (r.state === "offline") r.text = "PC offline";
      return r;
    }
    piModels = (gw.pi_models || []).map(n => ({ id: "pi:" + n, name: n + " (Pi)", pi: true, loaded: true, instances: [], vision: false }));
    if (gw.pc === "awake" && gw.lm) {
      const r = await probePc(timeoutMs);
      if (r.state === "online") {
        ls.set("pcModels", models.map(m => ({ id: m.id, name: m.name, type: m.type, vision: m.vision, size: m.size, params: m.params })));
        models = models.concat(piModels);
        return { state: "online", text: "PC awake" };
      }
    }
    canManage = false;
    models = ls.get("pcModels", []).map(m => Object.assign({}, m, { loaded: false, instances: [] })).concat(piModels);
    if (gw.pc === "awake") return { state: "error", text: "LM Studio server off" };
    if (gw.pc === "waking") return { state: "checking", text: "Waking PC…" };
    return { state: "asleep", text: "PC asleep · tap to wake" };
  }

  // Wake the PC through the Pi and wait until LM Studio answers.
  let waking = null;
  function wakePc(signal) {
    if (waking) return waking;
    waking = (async () => {
      setStatus("checking", "Waking PC…");
      try { await fetch(base() + "/gw/wake", { method: "POST", headers: headers() }); } catch {}
      const limit = Date.now() + ((gw && gw.wake_timeout) || 90) * 1000 + 10000;
      while (Date.now() < limit) {
        if (signal && signal.aborted) return false;
        await new Promise(r => setTimeout(r, 2000));
        try {
          const g = await gwFetchStatus(4000);
          if (g && g.gateway) { gw = g; if (g.pc === "awake" && g.lm) return true; }
        } catch {}
      }
      return false;
    })();
    waking.finally(() => { waking = null; });
    return waking;
  }

  async function sleepPc() {
    try {
      const r = await fetch(base() + "/gw/sleep", { method: "POST", headers: headers() });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { toast((j.error && j.error.message) || "Couldn't put the PC to sleep.", 4500); return; }
      toast("Your PC is going to sleep 💤");
      setStatus("checking", "PC going to sleep…");
      setTimeout(checkStatus, 15000);
    } catch { toast("Couldn't reach the Pi."); }
  }

  let checking = false;
  async function checkStatus() {
    if (checking || controller) return;
    checking = true;
    if (status !== "online") setStatus("checking", "Checking…");
    const r = await probe();
    if (!waking) setStatus(r.state, r.text);
    updateTitle();
    if ($("#modelSheet").classList.contains("open")) renderModels();
    checking = false;
  }

  function pickModel() {
    if (settings.model) return settings.model;
    const pc = models.filter(m => !m.pi);
    const loaded = pc.find(m => m.loaded);
    if (loaded || pc[0]) return (loaded || pc[0]).id;
    if (gw && !(gw.pc === "awake" && gw.lm)) return undefined;   // PC asleep: wake it, pick after
    return (models[0] || {}).id;
  }
  const modelInfo = id => models.find(m => m.id === id);
  const shortModel = id => id ? id.replace(/^pi:/, "").split("/").pop() : "Home AI";
  function updateTitle() {
    const id = pickModel();
    els.title.textContent = id ? shortModel(id) : "Home AI";
  }

  function renderModels() {
    const list = $("#modelList");
    const sel = pickModel();
    if (!models.length) {
      list.innerHTML = '<div class="list-empty">' + (status === "online" ? "No models found." : "Can't see your PC right now. Turn it on and tap Refresh.") + "</div>";
      return;
    }
    list.innerHTML = "";
    const sorted = [...models].sort((a, b) => (b.loaded - a.loaded) || a.id.localeCompare(b.id));
    for (const m of sorted) {
      const row = document.createElement("div");
      row.className = "model" + (m.id === sel ? " sel" : "");
      const gb = m.size ? (m.size / 1e9).toFixed(1) + " GB" : "";
      const sub = [m.params, gb].filter(Boolean).join(" · ") || m.id;
      const pick = document.createElement("button");
      pick.className = "pick";
      pick.innerHTML = '<span class="tick">' + (m.id === sel ? "✓" : "") + '</span><span class="mn"><b>' + esc(m.name || shortModel(m.id)) + "</b><small>" + esc(sub) + "</small>" +
        '<span class="badges">' + (m.pi ? '<span class="badge">Raspberry Pi</span>' : (modelsDetailed && m.loaded ? '<span class="badge on">Loaded</span>' : "")) +
        (m.vision ? '<span class="badge vis">Vision</span>' : "") + "</span></span>";
      pick.onclick = () => {
        settings.model = m.id; ls.set("settings", settings);
        updateTitle(); closeSheet("modelSheet");
        toast(m.pi ? "Switched to " + shortModel(m.id) + " on the Pi (works even when the PC sleeps)." : modelsDetailed && !m.loaded ? "Switched to " + shortModel(m.id) + ". It'll load when you send a message." : "Switched to " + shortModel(m.id));
      };
      row.appendChild(pick);
      if (canManage && !m.pi) {
        const act = document.createElement("button");
        act.className = "act" + (m.loaded ? "" : " load");
        act.textContent = busyModel === m.id ? (m.loaded ? "Unloading…" : "Loading…") : (m.loaded ? "Unload" : "Load");
        act.disabled = !!busyModel || !!controller;
        act.onclick = () => (m.loaded ? unloadModel(m) : loadModel(m));
        row.appendChild(act);
      }
      list.appendChild(row);
    }
  }

  async function postJSON(path, body) {
    const res = await fetch(base() + path, { method: "POST", headers: headers(), body: JSON.stringify(body) });
    let j = null; try { j = await res.json(); } catch {}
    if (!res.ok) throw new Error((j && j.error && (j.error.message || j.error)) || ("Error " + res.status));
    return j;
  }

  async function unloadModel(m) {
    busyModel = m.id; renderModels();
    try {
      for (const id of (m.instances.length ? m.instances : [m.id])) await postJSON("/api/v1/models/unload", { instance_id: id });
      toast("Unloaded " + shortModel(m.id));
    } catch (e) { toast("Couldn't unload: " + e.message, 4000); }
    busyModel = null;
    await checkStatus(); renderModels();
  }

  async function loadModel(m) {
    busyModel = m.id; renderModels();
    try {
      // free memory first: unload whatever else is loaded
      for (const other of models.filter(x => x.loaded && x.id !== m.id))
        for (const id of (other.instances.length ? other.instances : [other.id])) await postJSON("/api/v1/models/unload", { instance_id: id });
      toast("Loading " + shortModel(m.id) + " on your PC… this can take a minute.", 60000);
      const r = await postJSON("/api/v1/models/load", { model: m.id });
      settings.model = m.id; ls.set("settings", settings);
      toast(shortModel(m.id) + " loaded" + (r && r.load_time_seconds ? " in " + Math.round(r.load_time_seconds) + "s" : "") + " ✓");
    } catch (e) { toast("Couldn't load: " + e.message, 5000); }
    busyModel = null;
    await checkStatus(); updateTitle(); renderModels();
  }

  // ---------- rendering ----------
  function renderEmpty() {
    els.messages.innerHTML =
      '<div class="empty"><img src="icon-192.png" alt=""><h2>Your PC, your AI.</h2>' +
      "<p>" + (settings.token ? "Ask anything, send a photo, or tap the mic and talk."
        : "Add your LM Studio token in Settings to get started.") + "</p>" +
      (settings.token ? "" : '<button class="btn primary setup">Set up</button>') + "</div>";
    const b = els.messages.querySelector(".setup");
    if (b) b.onclick = openSettings;
  }

  function msgEl(m, isLast) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + m.role;
    if (m.role === "user") {
      if (m.images && m.images.length) {
        const imgs = document.createElement("div"); imgs.className = "imgs";
        m.images.forEach(src => { const i = document.createElement("img"); i.src = src; i.alt = "Attached image"; imgs.appendChild(i); });
        wrap.appendChild(imgs);
      }
      if (m.content) { const b = document.createElement("div"); b.className = "bubble"; b.textContent = m.content; wrap.appendChild(b); }
      return wrap;
    }
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    fillAssistant(bubble, m, isLast && !!controller);
    wrap.appendChild(bubble);
    if (!(isLast && controller)) {
      const meta = document.createElement("div");
      meta.className = "meta";
      const cp = document.createElement("button"); cp.textContent = "Copy"; cp.onclick = () => copy(parts(m).c, cp);
      const sp = document.createElement("button"); sp.textContent = speakingMsg === m ? "Stop" : "Listen"; sp.onclick = () => toggleSpeak(m, sp);
      meta.append(cp, sp);
      if (isLast) { const rg = document.createElement("button"); rg.textContent = "Retry"; rg.onclick = regenerate; meta.appendChild(rg); }
      if (m.model) { const t = document.createElement("span"); t.className = "model-tag"; t.textContent = shortModel(m.model); meta.appendChild(t); }
      wrap.appendChild(meta);
    }
    return wrap;
  }

  function fillAssistant(bubble, m, live) {
    const p = parts(m);
    let html = "";
    if (m.note) html += '<div class="loading-note" style="margin-bottom:8px">' + esc(m.note) + "</div>";
    if (live && !p.r && !p.c) html += '<div class="loading-note">' + (m.waking ? "Waking your PC… (about 10–30 seconds)" : m.loadingHint ? "Loading " + esc(shortModel(m.model)) + " on your PC…" : "") + "</div>";
    if (p.r) {
      const thinking = live && !p.c;
      html += '<details class="think"' + (thinking ? " open" : "") + "><summary>" + (thinking ? "Thinking…" : "Thought process") +
        '</summary><div class="tb">' + esc(p.r) + "</div></details>";
    }
    html += '<div class="answer' + (live ? " typing" : "") + '">' + md(p.c) + "</div>";
    if (m.stopped) html += '<div class="err" style="color:var(--muted)">Stopped.</div>';
    if (m.error) html += '<div class="err">' + esc(m.error) + "</div>";
    bubble.innerHTML = html;
    if (live) { const tb = bubble.querySelector(".tb"); if (tb) tb.scrollTop = tb.scrollHeight; }
  }

  function render() {
    const chat = current();
    if (!chat || !chat.messages.length) renderEmpty();
    else {
      els.messages.innerHTML = "";
      chat.messages.forEach((m, i) => els.messages.appendChild(msgEl(m, i === chat.messages.length - 1)));
      scrollBottom(true);
    }
    renderList();
  }

  function renderList() {
    els.chatList.innerHTML = "";
    if (!chats.length) { els.chatList.innerHTML = '<div class="list-empty">No chats yet.</div>'; return; }
    [...chats].sort((a, b) => b.updated - a.updated).forEach(c => {
      const row = document.createElement("div");
      row.className = "chat-item" + (c.id === currentId ? " active" : "");
      const open = document.createElement("button");
      open.className = "open"; open.textContent = c.title || "New chat";
      open.onclick = () => { if (controller) return; currentId = c.id; save(); render(); closeDrawer(); };
      const del = document.createElement("button");
      del.className = "del"; del.textContent = "×"; del.setAttribute("aria-label", "Delete chat");
      del.onclick = () => {
        if (controller && c.id === currentId) return;
        if (!confirm("Delete this chat?")) return;
        chats = chats.filter(x => x.id !== c.id);
        if (currentId === c.id) currentId = null;
        save(); render();
      };
      row.append(open, del);
      els.chatList.appendChild(row);
    });
  }

  let nearBottom = true;
  els.messages.addEventListener("scroll", () => {
    const el = els.messages;
    nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  });
  function scrollBottom(force) { if (force || nearBottom) els.messages.scrollTop = els.messages.scrollHeight; }

  els.messages.addEventListener("click", e => {
    const b = e.target.closest(".cp");
    if (b) copy(b.parentElement.querySelector("code").textContent, b);
  });

  async function copy(text, btn) {
    try { await navigator.clipboard.writeText(text); } catch {
      const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch {} ta.remove();
    }
    const old = btn.textContent; btn.textContent = "Copied"; setTimeout(() => (btn.textContent = old), 1200);
  }

  // ---------- images ----------
  async function shrink(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const max = 1280;
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      return c.toDataURL("image/jpeg", 0.85);
    } finally { URL.revokeObjectURL(url); }
  }
  function renderPending() {
    els.attachments.innerHTML = "";
    pending.forEach((src, i) => {
      const t = document.createElement("div"); t.className = "thumb";
      t.innerHTML = '<img alt="">'; t.firstChild.src = src;
      const x = document.createElement("button"); x.textContent = "×"; x.setAttribute("aria-label", "Remove image");
      x.onclick = () => { pending.splice(i, 1); renderPending(); updateSend(); };
      t.appendChild(x); els.attachments.appendChild(t);
    });
    updateSend();
  }
  $("#attachBtn").onclick = () => {
    const info = modelInfo(pickModel());
    if (info && info.vision === false) { toast(shortModel(info.id) + " can't see images. Tap the model name at the top to pick a Vision model."); return; }
    $("#fileInput").click();
  };
  $("#fileInput").onchange = async e => {
    const files = [...e.target.files].slice(0, 4 - pending.length);
    e.target.value = "";
    for (const f of files) {
      try { pending.push(await shrink(f)); } catch { toast("Couldn't read that image."); }
    }
    renderPending();
  };

  // ---------- voice: speech to text ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null;
  function stopRec() { if (rec) { try { rec.stop(); } catch {} } }
  els.mic.onclick = () => {
    if (rec) { stopRec(); return; }
    if (!SR) { toast("Voice typing isn't available here. Use the 🎤 on your iPhone keyboard instead.", 3800); return; }
    try {
      const r = new SR();
      r.lang = navigator.language || "en-GB";
      r.interimResults = true;
      r.continuous = true;
      const before = els.input.value.trim();
      r.onresult = e => {
        let t = "";
        for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
        els.input.value = (before ? before + " " : "") + t.trim();
        autosize();
      };
      r.onerror = e => {
        if (e.error === "not-allowed" || e.error === "service-not-allowed")
          toast("Voice typing is blocked here. Allow the microphone, or use the 🎤 on your keyboard.", 4000);
        else if (e.error !== "no-speech" && e.error !== "aborted") toast("Voice error: " + e.error);
      };
      r.onend = () => { rec = null; els.mic.classList.remove("rec"); };
      r.start();
      rec = r; els.mic.classList.add("rec");
    } catch { rec = null; els.mic.classList.remove("rec"); toast("Couldn't start voice typing. Use the 🎤 on your keyboard."); }
  };

  // ---------- voice: text to speech ----------
  let speakingMsg = null;
  function speakable(text) {
    return text.replace(/```[\s\S]*?(```|$)/g, " (code block) ")
      .replace(/`([^`]+)`/g, "$1").replace(/[*_#>]+/g, "").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
      .replace(/^\s*[-•]\s+/gm, "").replace(/\s+/g, " ").trim();
  }
  function stopSpeaking() { if ("speechSynthesis" in window) speechSynthesis.cancel(); speakingMsg = null; }
  function speak(m, btn) {
    if (!("speechSynthesis" in window)) { toast("Read-aloud isn't supported here."); return; }
    stopSpeaking();
    const text = speakable(parts(m).c);
    if (!text) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = navigator.language || "en-GB";
    u.onend = u.onerror = () => { if (speakingMsg === m) { speakingMsg = null; if (btn) btn.textContent = "Listen"; } };
    speakingMsg = m; if (btn) btn.textContent = "Stop";
    speechSynthesis.speak(u);
  }
  function toggleSpeak(m, btn) { if (speakingMsg === m) { stopSpeaking(); btn.textContent = "Listen"; } else { render(); speak(m, findListenBtn(m)); } }
  function findListenBtn(m) {
    const chat = current(); if (!chat) return null;
    const idx = chat.messages.indexOf(m);
    const el = els.messages.children[idx];
    return el ? [...el.querySelectorAll(".meta button")].find(b => b.textContent === "Listen") : null;
  }

  // ---------- chatting ----------
  function newChat() {
    const c = { id: uid(), title: "", messages: [], updated: Date.now() };
    chats.push(c); currentId = c.id; save();
    return c;
  }

  function friendly(detail, res) {
    if (res) {
      if (res.status === 401 || res.status === 403) return "Your PC rejected the token. Check it in Settings.";
      if (detail && (res.status === 503 || res.status === 504)) return detail;
      if (res.status === 502 || res.status === 503) return "Your PC is on, but LM Studio's server isn't running. Flip the Status toggle in LM Studio.";
      return "Error " + res.status + (detail ? ": " + detail : "");
    }
    return "Couldn't reach your PC. Check that it's on, LM Studio's server is running, and Tailscale is switched on on this phone.";
  }

  function buildHistory(chat) {
    const msgs = chat.messages.slice(0, -1).slice(-30);
    // only send images for the 2 most recent image messages to save context
    let imgBudget = 2;
    const out = [];
    for (let i = msgs.length - 1; i >= 0; i--) {
      const m = msgs[i];
      if (m.role === "assistant") { out.unshift({ role: "assistant", content: parts(m).c }); continue; }
      if (m.images && m.images.length) {
        if (imgBudget > 0) {
          imgBudget--;
          const content = m.images.map(u => ({ type: "image_url", image_url: { url: u } }));
          if (m.content) content.unshift({ type: "text", text: m.content });
          out.unshift({ role: "user", content });
        } else {
          out.unshift({ role: "user", content: (m.content || "") + " [earlier image not re-sent]" });
        }
      } else out.unshift({ role: "user", content: m.content });
    }
    return out;
  }

  async function run(chat) {
    stopSpeaking();
    let model = pickModel();
    const info = modelInfo(model);
    const needsWake = !!(gw && !(model || "").startsWith("pi:") && !(gw.pc === "awake" && gw.lm));
    const msg = { role: "assistant", content: "", reasoning: "", model, waking: needsWake,
                  loadingHint: !!(modelsDetailed && info && !info.loaded && !info.pi) };
    chat.messages.push(msg);
    chat.updated = Date.now();
    controller = new AbortController();
    setSending(true);
    render();
    const bubble = els.messages.lastElementChild.querySelector(".bubble");

    let frame = 0;
    const paint = () => { frame = 0; fillAssistant(bubble, msg, true); scrollBottom(); };
    try {
      if (needsWake) {
        const ok = await wakePc(controller.signal);
        msg.waking = false;
        if (controller.signal.aborted) throw new DOMException("stopped", "AbortError");
        if (ok) {
          const r = await probe();
          setStatus(r.state, r.text);
          updateTitle();
          if (!model) { model = pickModel(); msg.model = model; }
        } else if (gw && gw.fallback && piModels.length) {
          model = piModels[0].id; msg.model = model; msg.loadingHint = false;
          msg.note = "Your PC didn't wake up, so the Pi answered with " + shortModel(model) + ".";
        } else {
          throw Object.assign(new Error("wake"), { wakeFailed: true });
        }
        paint();
      }
      const body = { messages: (settings.system.trim() ? [{ role: "system", content: settings.system.trim() }] : []).concat(buildHistory(chat)), stream: true };
      if (model) body.model = model;
      const res = await fetch(base() + "/v1/chat/completions", { method: "POST", headers: headers(), body: JSON.stringify(body), signal: controller.signal });
      if (!res.ok) {
        let detail = ""; try { const j = await res.json(); detail = (j.error && (j.error.message || j.error)) || ""; } catch {}
        msg.error = friendly(typeof detail === "string" ? detail : "", res);
      } else {
        setStatus("online", gw ? "PC awake" : "PC online");
        if (info) info.loaded = true;
        const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let i;
          while ((i = buf.indexOf("\n")) >= 0) {
            const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
            if (!line.startsWith("data:")) continue;
            const data = line.slice(5).trim();
            if (!data || data === "[DONE]") continue;
            let j; try { j = JSON.parse(data); } catch { continue; }
            if (j.error) { msg.error = "Model error: " + (j.error.message || JSON.stringify(j.error)); continue; }
            const d = (j.choices && j.choices[0] && j.choices[0].delta) || {};
            if (d.reasoning_content) msg.reasoning += d.reasoning_content;
            else if (typeof d.reasoning === "string") msg.reasoning += d.reasoning;
            if (d.content) msg.content += d.content;
            if (!frame) frame = requestAnimationFrame(paint);
          }
        }
        if (!parts(msg).c && !msg.error) msg.error = "The model didn't return an answer (it may have run out of context — try a new chat).";
      }
    } catch (e) {
      if (e.name === "AbortError") msg.stopped = true;
      else if (e.wakeFailed) { msg.error = "Your PC didn't wake up. Check it's plugged in and not fully shut down."; checkStatus(); }
      else { msg.error = friendly(); setStatus("offline", "PC offline"); }
    } finally {
      if (frame) cancelAnimationFrame(frame);
      delete msg.loadingHint; delete msg.waking;
      controller = null;
      chat.updated = Date.now();
      save(); setSending(false); render(); updateTitle();
      if (settings.autoSpeak && !msg.error && !msg.stopped) speak(msg, findListenBtn(msg));
    }
  }

  function sendMessage() {
    const text = els.input.value.trim();
    if ((!text && !pending.length) || controller) return;
    if (!base() || !settings.token) { openSettings(); return; }
    stopRec();
    const info = modelInfo(pickModel());
    if (pending.length && info && info.vision === false) { toast(shortModel(info.id) + " can't see images. Pick a Vision model first."); return; }
    const chat = current() || newChat();
    const m = { role: "user", content: text };
    if (pending.length) m.images = pending.slice();
    chat.messages.push(m);
    if (!chat.title) chat.title = text ? text.replace(/\s+/g, " ").slice(0, 48) : "📷 Image";
    els.input.value = ""; pending = []; renderPending(); autosize();
    nearBottom = true;
    run(chat);
  }

  function regenerate() {
    const chat = current();
    if (!chat || controller) return;
    while (chat.messages.length && chat.messages[chat.messages.length - 1].role === "assistant") chat.messages.pop();
    if (!chat.messages.length) return;
    run(chat);
  }

  function setSending(on) {
    els.send.classList.toggle("stop", on);
    els.send.setAttribute("aria-label", on ? "Stop" : "Send");
    els.send.innerHTML = on
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
    updateSend();
  }
  function updateSend() { els.send.disabled = !controller && !els.input.value.trim() && !pending.length; }

  els.send.onclick = () => { if (controller) controller.abort(); else sendMessage(); };

  const coarse = matchMedia("(pointer:coarse)").matches;
  els.input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !coarse && !e.isComposing) { e.preventDefault(); sendMessage(); }
  });
  function autosize() {
    els.input.style.height = "auto";
    els.input.style.height = Math.min(els.input.scrollHeight, 160) + "px";
    updateSend();
  }
  els.input.addEventListener("input", autosize);

  // ---------- drawer ----------
  const openDrawer = () => { renderList(); document.body.classList.add("drawer-open"); };
  const closeDrawer = () => document.body.classList.remove("drawer-open");
  $("#menuBtn").onclick = openDrawer;
  $("#scrim").onclick = closeDrawer;
  const startNew = () => { if (controller) return; const c = current(); if (c && !c.messages.length) { closeDrawer(); return; } currentId = null; save(); render(); closeDrawer(); };
  $("#newBtn").onclick = startNew;
  $("#drawerNew").onclick = startNew;

  // ---------- sheets ----------
  const openSheet = id => $("#" + id).classList.add("open");
  const closeSheet = id => $("#" + id).classList.remove("open");
  document.querySelectorAll(".sheet").forEach(s => {
    s.addEventListener("click", e => { if (e.target === s || e.target.closest("[data-close]")) s.classList.remove("open"); });
  });

  $("#titleBtn").onclick = () => { closeDrawer(); renderModels(); openSheet("modelSheet"); checkStatus(); };
  $("#refreshModels").onclick = async () => { $("#modelList").innerHTML = '<div class="list-empty">Checking…</div>'; await checkStatus(); renderModels(); };

  function openSettings() {
    closeDrawer();
    $("#sUrl").value = settings.url; $("#sToken").value = settings.token; $("#sSystem").value = settings.system;
    $("#sAutoSpeak").checked = !!settings.autoSpeak;
    $("#testOut").textContent = ""; $("#testOut").className = "";
    openSheet("settingsSheet");
  }
  function readForm() {
    let url = $("#sUrl").value.trim() || DEFAULT_URL;
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    return { url, token: $("#sToken").value.trim(), system: $("#sSystem").value, autoSpeak: $("#sAutoSpeak").checked };
  }
  $("#settingsBtn").onclick = openSettings;
  els.pill.onclick = async () => {
    if (!settings.token && !gw) { openSettings(); return; }
    if (gw && gw.pc === "asleep" && !waking) {
      toast("Waking your PC…");
      const ok = await wakePc();
      toast(ok ? "Your PC is awake ✓" : "Your PC didn't wake up.");
      checkStatus();
      return;
    }
    if (gw && gw.pc === "awake" && !controller && !waking) {
      if (confirm("Put your PC to sleep?")) sleepPc();
      return;
    }
    checkStatus();
  };
  $("#testBtn").onclick = async () => {
    const out = $("#testOut");
    const prev = settings; settings = Object.assign({}, settings, readForm());
    out.className = ""; out.textContent = "Testing…";
    const r = await probe(8000);
    settings = prev;
    if (r.state === "online") { out.className = "ok"; out.textContent = "Connected ✓ " + models.length + " model" + (models.length === 1 ? "" : "s") + " found"; }
    else { out.className = "bad"; out.textContent = r.state === "offline" ? "Can't reach it. Is the PC on, Tailscale on here, and CORS enabled in LM Studio?" : r.text; }
  };
  $("#saveBtn").onclick = () => {
    settings = Object.assign(settings, readForm());
    ls.set("settings", settings);
    closeSheet("settingsSheet"); render(); checkStatus();
  };
  $("#wipeBtn").onclick = () => {
    if (controller || !confirm("Delete all chats on this phone?")) return;
    chats = []; currentId = null; save(); render(); closeSheet("settingsSheet");
  };

  // ---------- iOS viewport / keyboard ----------
  function fitViewport() {
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty("--app-h", h + "px");
    window.scrollTo(0, 0);
  }
  if (window.visualViewport) visualViewport.addEventListener("resize", () => { fitViewport(); scrollBottom(); });
  window.addEventListener("resize", fitViewport);
  fitViewport();

  // ---------- start ----------
  document.addEventListener("visibilitychange", () => { if (!document.hidden) checkStatus(); });
  setInterval(() => { if (!document.hidden) checkStatus(); }, 20000);
  render();
  if (!settings.token) setStatus("setup", "Tap to set up");
  checkStatus();
})();
</script>
</body>
</html>
